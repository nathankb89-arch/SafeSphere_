services:
  - type: web
    name: safesphere-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_REMOTE_DATABASE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: safesphere-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: safesphere-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: safesphere-db
    databaseName: safesphere
    user: safesphere